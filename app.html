<style>
/* Layout: フルブリード1画面。背景色＝その日の天気。指の動きに連動して日付・背景・文字色が切り替わり、離すとバネで収まる。
   4社の見立ては下から引き上げるシート（背景のページが奥へ沈む）。天気ごとに色を変えるため単一ルック（テーマ非連動） */
:root{
  --teal:#64C6C7; --sun:#F6DE7D; --sand:#F5DEB3; --slate:#708090; --ivory:#FFFAF0;
  --ink:#2c3a47; --ink-soft:#5d6b7a; --line:#e6ddcc;
  --fg:#ffffff; --fg-soft:rgba(255,255,255,.78); --fg-line:rgba(255,255,255,.5); --dot:#F6DE7D;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-num:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  color-scheme:light;
}
.w-sun{--fg:#4d3f17; --fg-soft:rgba(77,63,23,.72); --fg-line:rgba(77,63,23,.38); --dot:#4d3f17}
*{box-sizing:border-box}
html{height:100%;background:#0d1317}
body{margin:0;height:100%;overflow:hidden;background:#0d1317;font-family:var(--f-ui);color:var(--fg);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.li{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

#scene{position:fixed;inset:0;overflow:hidden;transform-origin:50% 0;will-change:transform}
.bg{position:absolute;inset:0;will-change:opacity;transform:translateZ(0)}
.g-sun{background:linear-gradient(180deg,#f2cc55 0%,#F6DE7D 45%,#F5DEB3 100%)}
.g-cs{background:linear-gradient(180deg,#8d9eac 0%,#64C6C7 100%)}
.g-cl{background:linear-gradient(180deg,#a3b0bb 0%,#708090 100%)}
.g-rn{background:linear-gradient(180deg,#4f606e 0%,#2b3842 100%)}

.stage{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
.bar,.foot{padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--fg);transition:color .3s ease}
.bar{display:flex;justify-content:space-between;gap:8px;font-size:.74rem}
.bar,.bar span{color:var(--fg-soft)}
.live{margin-left:8px;color:var(--fg)!important}
.live b{font-family:var(--f-num);font-weight:400;font-size:.9rem}

.vp{position:relative;flex:1;overflow:hidden;touch-action:none}
.track{display:flex;height:100%;will-change:transform}
.panel{will-change:transform,opacity;backface-visibility:hidden;flex:0 0 100%;height:100%;display:flex;flex-direction:column;align-items:center;color:var(--fg);
  padding:clamp(4px,1.2vh,12px) max(16px,env(safe-area-inset-right,0px)) 0 var(--gut)}
.panel.empty{visibility:hidden}
.day{font-family:var(--f-num);font-weight:300;font-size:clamp(1.4rem,4.2vh,1.9rem);letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.day small{font-family:var(--f-ui);font-size:.82rem;color:var(--fg-soft);letter-spacing:0}
.day .tag{font-family:var(--f-ui);font-size:.68rem;border:1px solid var(--fg-line);border-radius:99px;padding:0 8px;letter-spacing:0;align-self:center}
.hero{display:flex;flex-direction:column;align-items:center}
.t{display:flex;align-items:flex-start;gap:4px;line-height:1}
.big{font-family:var(--f-num);font-weight:200;font-size:clamp(92px,20vh,168px);letter-spacing:-.04em;line-height:.9;will-change:transform}
.deg{font-family:var(--f-num);font-weight:200;font-size:clamp(32px,6vh,50px);margin-top:.15em}
.lo{display:flex;flex-direction:column;margin:auto 0 .5em 6px;font-size:.78rem;color:var(--fg-soft)}
.lo b{font-family:var(--f-num);font-weight:300;font-size:clamp(1.6rem,4.4vh,2.2rem);color:var(--fg);line-height:1.1}
.icw{will-change:transform;margin-top:clamp(0px,1vh,10px)}
.wxic{width:clamp(96px,17vh,140px);height:clamp(96px,17vh,140px)}
.wx{font-weight:300;font-size:clamp(1.15rem,3.1vh,1.5rem);letter-spacing:.04em;margin-top:2px;text-align:center;text-wrap:balance}
.chip{font-size:.72rem;margin-top:8px;border:1px solid var(--fg-line);border-radius:99px;padding:2px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 8px;align-items:center}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.lower{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);padding-bottom:4px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;border-top:1px solid var(--fg-line);padding-top:8px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:1px}
.strip .h{font-size:.6rem;color:var(--fg-soft)}
.strip svg{width:24px;height:24px}
.strip .tt{font-family:var(--f-num);font-weight:300;font-size:.84rem}
.tips{display:grid;grid-template-columns:repeat(var(--n),1fr);text-align:center}
.tip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tip svg{width:30px;height:30px}
.tip span{font-size:.64rem;color:var(--fg-soft)}
.tip b{font-weight:400;font-size:.84rem;line-height:1.3}
.lv{display:flex;gap:3px;margin-top:3px}
.lv i{width:10px;height:2px;border-radius:2px;background:var(--fg-line)}
.lv i.on{background:var(--fg)}
.note{font-size:.82rem;line-height:1.6;text-align:center;margin:0 auto;max-width:30em;font-weight:300}

.nav{position:absolute;top:var(--ay,45%);width:44px;height:64px;margin-top:-32px;display:grid;place-items:center;color:var(--fg);transition:opacity .25s ease,color .3s ease;z-index:2}
.nav.l{left:max(4px,env(safe-area-inset-left,0px))}.nav.r{right:max(4px,env(safe-area-inset-right,0px))}
.nav[disabled]{opacity:.18;cursor:default}
.nav svg{width:30px;height:44px}

.foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px}
.dots{position:relative;display:flex;gap:7px}
.dots button{width:18px;height:18px;display:grid;place-items:center}
.dots button i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--fg-soft);display:block;transition:border-color .3s}
.ind{position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--dot);transform-origin:center;pointer-events:none;will-change:transform;transition:background .3s}
.up{font-size:.72rem;color:var(--fg-soft);display:flex;align-items:center;gap:6px;padding:4px 12px}
.up svg{width:14px;height:14px}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:6px}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.5);opacity:0;pointer-events:none;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:-40px;z-index:21;max-height:calc(88% + 40px);overflow-y:auto;overscroll-behavior:contain;background:var(--ivory);color:var(--ink);border-radius:24px 24px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(58px + env(safe-area-inset-bottom,0px)) var(--gut);transform:translate3d(0,110%,0);will-change:transform;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 4px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{margin:0;font-size:.98rem}
.sh-head p{margin:0;font-size:.74rem;color:var(--ink-soft)}
.x{width:34px;height:34px;border-radius:50%;background:#fff;font-size:1rem;flex:none;color:var(--ink)}
.src{background:#fff;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border-left:5px solid var(--c);opacity:0;transform:translateY(18px)}
.sheet.shown .src,.sheet.shown .why{animation:float .5s cubic-bezier(.22,1,.36,1) forwards}
.sheet.shown .src:nth-child(4){animation-delay:.05s}.sheet.shown .src:nth-child(5){animation-delay:.1s}.sheet.shown .src:nth-child(6){animation-delay:.15s}.sheet.shown .why{animation-delay:.2s}
@keyframes float{to{opacity:1;transform:none}}
.src svg{width:40px;height:40px;color:var(--slate)}
.src .nm{font-weight:700;font-size:.88rem}
.src .nm small{font-weight:400;color:var(--ink-soft);font-size:.66rem;margin-left:6px}
.src .ws{font-size:.8rem;line-height:1.35}
.src .nt{grid-column:1/-1;font-size:.74rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px}
.src .nt a{color:#1f8f91}
.src .tv{font-family:var(--f-num);text-align:right;white-space:nowrap}
.src .tv b{color:#c07f17;font-weight:400;font-size:1.15rem}
.src .tv span{color:#1f8f91;margin-left:4px}
.src .tv small{display:block;font-size:.66rem;color:var(--ink-soft)}
.why{background:#e3f4f4;border-radius:14px;padding:10px 12px;font-size:.8rem;opacity:0;transform:translateY(18px)}
.why b{display:block;font-size:.72rem;color:#1f8f91;margin-bottom:2px}
.src-foot{font-size:.66rem;color:var(--ink-soft);text-align:center}
.x:focus-visible,.src a:focus-visible{outline-color:#1f8f91}
@media (prefers-reduced-motion:reduce){.sheet.shown .src,.sheet.shown .why{animation:none;opacity:1;transform:none}}
@media (max-height:640px){.strip{display:none}}

const sunL=(x,y,r)=>{let s=`<circle cx="${x}" cy="${y}" r="${r}"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line x1="${(x+Math.cos(a)*(r+4)).toFixed(1)}" y1="${(y+Math.sin(a)*(r+4)).toFixed(1)}" x2="${(x+Math.cos(a)*(r+9)).toFixed(1)}" y2="${(y+Math.sin(a)*(r+9)).toFixed(1)}"/>`}return s};
const cloudL=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" vector-effect="non-scaling-stroke" d="M14 40h30a11 11 0 0 0 0-22 15 15 0 0 0-28-3 11 11 0 0 0-2 25z"/>`;
const dropsL=(x,y)=>[0,9,18].map(d=>`<line x1="${x+d}" y1="${y}" x2="${x+d-3}" y2="${y+7}"/>`).join('');
const arrowL=x=>`<path d="M${x} 30l4 3-4 3"/>`;

function agree(day){
  const s=Object.values(day.src), his=s.map(x=>x.hi).filter(v=>typeof v==='number');
  const pops=s.map(x=>parseInt((String(x.pop).match(/\d+/g)||[]).pop())).filter(n=>!isNaN(n));
  const hs=Math.max(...his)-Math.min(...his), ps=pops.length>1?Math.max(...pops)-Math.min(...pops):0;
  if(hs<=1.5&&ps<=30) return {t:'高',c:'#7cd3a4'};
  if(hs<=4&&ps<=40) return {t:'中',c:'#F6DE7D'};
  return {t:'低',c:'#f0a07e'};
}

function setX(nx){

  const p=x/W, dir=x<0?1:-1, nm=moodOf(cur+dir), over=$('bgB');

  if(nm&&p!==0&&over.dataset.m!==nm){over.className='bg g-'+nm;over.dataset.m=nm}
  if(ov!==lastOver){over.style.opacity=ov;lastOver=ov}
  PR.forEach((r,k)=>{
    const off=(k-1)*W+x, q=Math.min(1,Math.abs(off)/W);
    r.el.style.opacity=1-q*.6;
    if(r.pz) r.pz.style.transform=`translate3d(${-off*.2}px,0,0)`;
    if(r.ic) r.ic.style.transform=`translate3d(${-off*.08}px,0,0) scale(${1-q*.12})`;

  const pos=Math.max(0,Math.min(DAYS.length-1,cur-p));
  const ind=$('ind'); if(ind){const stretch=1+Math.min(.8,Math.abs(p)*1.6*(1-Math.abs(p)));ind.style.transform=`translateX(${pos*STEP}px) scaleX(${stretch})`}
}
/* バネ（質量1・やや強めの減衰）。初速は指を離した瞬間の速度を引き継ぐ */
function spring(from,to,v0,step,done,k=420,c=40){
  if(REDUCED){step(to);done&&done();return null}
  let pos=from,vel=v0,last=performance.now(),id;
  const tick=now=>{
    const dt=Math.min(.032,(now-last)/1000); last=now;
    for(let s=0;s<4;s++){const h=dt/4,a=-k*(pos-to)-c*vel;vel+=a*h;pos+=vel*h}
    step(pos);
    if(Math.abs(pos-to)<.4&&Math.abs(vel)<8){step(to);done&&done();return}
    id=requestAnimationFrame(tick); ctl.id=id;
  };

  if(hAnim) hAnim.commit=dir;
}
/* 動いている途中で指が触れたら止める。日付の切り替え中なら、その切り替えを確定させてから位置を引き継ぐ */
function interrupt(){
  if(!hAnim) return;
  hAnim.cancel();
  const dir=hAnim.commit; hAnim=null;
  if(dir){ const keep=x; cur+=dir; renderPanels(); setX(keep+dir*W); }
}
function jump(k){
  if(k===cur) return;
  interrupt();
  if(Math.abs(k-cur)===1) return go(k>cur?1:-1);
  const over=$('bgB'); over.className='bg g-'+moodOf(k); over.dataset.m=moodOf(k);

}

vp.addEventListener('pointerdown',e=>{

    if(g.axis==='y'){prepareSheet(cur)} }
  g.samples.push([e.timeStamp,e.clientX,e.clientY]); if(g.samples.length>12)g.samples.shift();
  if(g.axis==='x'){
    let nx=g.bx+dx;
    if((cur===0&&nx>0)||(cur===DAYS.length-1&&nx<0)) nx=rubber(nx,W*.5);
    else if(nx>W) nx=W+rubber(nx-W,W*.3); else if(nx<-W) nx=-W+rubber(nx+W,W*.3);
    pendX=nx; if(!raf) raf=requestAnimationFrame(()=>{raf=0; if(pendX!==null){setX(pendX);pendX=null}});
  }else if(g.axis==='y'){
    let y=sheetH+dy; if(y<0)y=-rubber(-y,60); setSheet(y);
  }
});
function release(e){
  if(!g||e.pointerId!==g.id)return;
  if(raf){cancelAnimationFrame(raf);raf=0;if(pendX!==null){setX(pendX);pendX=null}}
  const s=g.samples, b=s[s.length-1]; let a=s[0];
  for(const q of s){ if(b[0]-q[0]<=100){a=q;break} }
  const dt=Math.max(8,b[0]-a[0]);
  const clampV=v=>Math.max(-4000,Math.min(4000,v));
  const vx=clampV((b[1]-a[1])/dt*1000), vy=clampV((b[2]-a[2])/dt*1000);
  if(g.axis==='x'){
    /* 判定はこのスワイプでの移動量と速さで行う（直前の切り替えの途中から始まっても向きを取り違えない） */
    const moved=(x-g.bx)/W;
    const flickL=vx<-180&&moved<-.02, flickR=vx>180&&moved>.02;
    let dir=0;
    if(flickL||moved<-.12) dir=1; else if(flickR||moved>.12) dir=-1;
    else { const near=Math.round(-x/W); dir=Math.max(-1,Math.min(1,near)); }
    if(dir&&DAYS[cur+dir]) go(dir,vx);
    else hAnim=spring(x,0,vx,setX,()=>{hAnim=null});
  }else if(g.axis==='y'){
    if(sheetY<sheetH*.75||vy<-500) openSheet(cur,vy); else closeSheet(vy);
  }
  if(g.axis) { suppressClick=true; setTimeout(()=>suppressClick=false,350) }
  g=null;
}

   <div class="why"><b>見立ての差</b>${d.why}</div>
   <div class="src-foot">${d.note}</div>`;
  $('close').addEventListener('click',()=>closeSheet());
  sheet.hidden=false; sheet.classList.remove('shown'); sheet.scrollTop=0;
  sheetH=sheet.offsetHeight-40; if(!sheetOpen) setSheet(sheetH+20);
}
function setSheet(y){
  sheetY=y; sheet.style.transform=`translate3d(0,${y}px,0)`;
  const p=Math.max(0,Math.min(1,1-y/sheetH));
  scrim.style.opacity=p; scrim.style.pointerEvents=p>.02?'auto':'none';
  scene.style.transform=`translate3d(0,${p*12}px,0) scale(${1-p*.07})`;
  scene.style.borderRadius=`${p*22}px`;
  if(p>.15&&!sheet.classList.contains('shown')) sheet.classList.add('shown');
}
function openSheet(i,v0=0){
  sAnim&&sAnim.cancel();
  if(!sheetOpen||sheetDay!==i){sheetOpen=false;prepareSheet(i)}
  lastFocus=document.activeElement; sheetOpen=true;
  sAnim=spring(sheetY,0,v0,setSheet,()=>$('close').focus({preventScroll:true}),260,30);
}
function closeSheet(v0=0){
  sAnim&&sAnim.cancel(); sheetOpen=false;
  sAnim=spring(sheetY,sheetH+20,v0,setSheet,()=>{sheet.hidden=true;scene.style.transform='';scene.style.borderRadius='';lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})},300,34);
}
scrim.addEventListener('click',()=>closeSheet());
let sg=null;
sheet.addEventListener('touchstart',e=>{sg={y0:e.touches[0].clientY,t:[[e.timeStamp,e.touches[0].clientY]],drag:false}},{passive:true});
sheet.addEventListener('touchmove',e=>{
  if(!sg)return; const dy=e.touches[0].clientY-sg.y0;
  if(!sg.drag){ if(sheet.scrollTop<=0&&dy>6){sg.drag=true;sg.y0=e.touches[0].clientY;sAnim&&sAnim.cancel()} else return }
  e.preventDefault();
  const d=e.touches[0].clientY-sg.y0; setSheet(d>0?d:-rubber(-d,60));
  sg.t.push([e.timeStamp,e.touches[0].clientY]); if(sg.t.length>6)sg.t.shift();
},{passive:false});
sheet.addEventListener('touchend',()=>{
  if(!sg||!sg.drag){sg=null;return}
  const a=sg.t[0],b=sg.t[sg.t.length-1],v=(b[1]-a[1])/Math.max(1,b[0]-a[0])*1000;
  if(sheetY>sheetH*.25||v>500) closeSheet(v); else openSheet(sheetDay,v);
  sg=null;
});

async function live(){
  try{
    const t=(await (await fetch('https://www.jma.go.jp/bosai/amedas/data/latest_time.txt',{cache:'no-store'})).text()).trim();
    const k=t.slice(0,4)+t.slice(5,7)+t.slice(8,10)+t.slice(11,13)+t.slice(14,16)+'00';

    const o=m['44132']; if(!o||!o.temp) return;
    const rain=o.precipitation10m&&o.precipitation10m[0]>0;
    $('live').innerHTML=`いま <b>${o.temp[0].toFixed(1)}°</b> ${t.slice(11,16)}${rain?'・雨':''}`;
  }catch(e){}
}
live(); setInterval(live,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)live()});

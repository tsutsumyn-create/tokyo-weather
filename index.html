<title>東京の天気</title>

<style>
/* Layout: フルブリード1画面。背景色＝その日の天気（晴れ:黄 / 曇り時々晴れ:スレート→ターコイズ / 曇り:グレー / 雨:濃スレート）。
   左右の矢印・スワイプで8日分を送り、タップか上スワイプで4社の見立てシート。天気ごとに色を変えるため単一ルック（テーマ非連動） */
:root{
  --teal:#64C6C7; --sun:#F6DE7D; --sand:#F5DEB3; --slate:#708090; --ivory:#FFFAF0;
  --ink:#2c3a47; --ink-soft:#5d6b7a; --line:#e6ddcc;
  --fg:#ffffff; --fg-soft:rgba(255,255,255,.78); --fg-line:rgba(255,255,255,.55); --dot:#F6DE7D;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-num:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  color-scheme:light;
}
:root.w-sun{--fg:#4d3f17; --fg-soft:rgba(77,63,23,.72); --fg-line:rgba(77,63,23,.4); --dot:#4d3f17}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--slate);color:var(--fg);font-family:var(--f-ui);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-tap-highlight-color:transparent;transition:color .4s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg.li{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* 背景2枚をクロスフェード */
.bg{position:fixed;inset:0;z-index:-1;transition:opacity .6s ease}
.g-sun{background:linear-gradient(180deg,#f2cc55 0%,#F6DE7D 45%,#F5DEB3 100%)}
.g-cs{background:linear-gradient(180deg,#8d9eac 0%,#64C6C7 100%)}
.g-cl{background:linear-gradient(180deg,#a3b0bb 0%,#708090 100%)}
.g-rn{background:linear-gradient(180deg,#4f606e 0%,#2b3842 100%)}

.stage{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;
  touch-action:pan-y;user-select:none}
.bar{width:100%;display:flex;justify-content:space-between;font-size:.74rem;color:var(--fg-soft)}
.day{font-family:var(--f-num);font-weight:300;font-size:clamp(1.4rem,4.2vh,1.9rem);letter-spacing:.04em;margin-top:clamp(4px,1.4vh,14px);display:flex;align-items:baseline;gap:8px}
.day small{font-family:var(--f-ui);font-size:.82rem;color:var(--fg-soft);letter-spacing:0}
.day .tag{font-family:var(--f-ui);font-size:.68rem;border:1px solid var(--fg-line);border-radius:99px;padding:0 8px;letter-spacing:0;align-self:center}
.hero{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;width:100%}
.t{display:flex;align-items:flex-start;gap:4px;line-height:1}
.big{font-family:var(--f-num);font-weight:200;font-size:clamp(92px,21vh,168px);letter-spacing:-.04em;line-height:.9}
.deg{font-family:var(--f-num);font-weight:200;font-size:clamp(32px,6vh,50px);margin-top:.15em}
.lo{display:flex;flex-direction:column;margin:auto 0 .5em 6px;font-size:.78rem;color:var(--fg-soft)}
.lo b{font-family:var(--f-num);font-weight:300;font-size:clamp(1.6rem,4.4vh,2.2rem);color:var(--fg);line-height:1.1}
.icrow{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:clamp(0px,1vh,10px)}
.nav{width:44px;height:64px;display:grid;place-items:center;transition:opacity .2s}
.nav[disabled]{opacity:.2;cursor:default}
.nav svg{width:30px;height:44px}
.wxic{width:clamp(96px,17vh,140px);height:clamp(96px,17vh,140px)}
.wx{font-weight:300;font-size:clamp(1.15rem,3.1vh,1.5rem);letter-spacing:.04em;margin-top:2px;text-align:center;text-wrap:balance}
.dots{display:flex;gap:7px;margin-top:clamp(8px,1.6vh,16px)}
.dots button{width:18px;height:18px;display:grid;place-items:center}
.dots i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--fg-soft);display:block}
.dots button[aria-current="true"] i{background:var(--dot);border-color:var(--dot);transform:scale(1.25)}
.chip{font-size:.72rem;margin-top:6px;border:1px solid var(--fg-line);border-radius:99px;padding:2px 12px;display:flex;gap:8px;align-items:center}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}

.lower{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,16px)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;border-top:1px solid var(--fg-line);padding-top:8px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:1px}
.strip .h{font-size:.6rem;color:var(--fg-soft)}
.strip svg{width:24px;height:24px}
.strip .tt{font-family:var(--f-num);font-weight:300;font-size:.84rem}
.tips{display:grid;grid-template-columns:repeat(var(--n),1fr);text-align:center}
.tip{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tip svg{width:30px;height:30px}
.tip span{font-size:.64rem;color:var(--fg-soft)}
.tip b{font-weight:400;font-size:.84rem;line-height:1.3}
.lv{display:flex;gap:3px;margin-top:3px}
.lv i{width:10px;height:2px;border-radius:2px;background:var(--fg-line)}
.lv i.on{background:var(--fg)}
.note{font-size:.82rem;line-height:1.6;text-align:center;color:var(--fg);margin:0 auto;max-width:30em;font-weight:300}
.up{align-self:center;font-size:.74rem;color:var(--fg-soft);display:flex;align-items:center;gap:6px;padding:4px 10px}
.up svg{width:14px;height:14px}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:6px}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(30,40,50,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;background:var(--ivory);color:var(--ink);border-radius:24px 24px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 4px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head h2{margin:0;font-size:.98rem}
.sh-head p{margin:0;font-size:.74rem;color:var(--ink-soft)}
.x{width:34px;height:34px;border-radius:50%;background:#fff;font-size:1rem;flex:none;color:var(--ink)}
.src{background:#fff;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border-left:5px solid var(--c);opacity:0;transform:translateY(24px)}
.sheet.on .src{animation:float .45s cubic-bezier(.2,.8,.2,1) forwards}
.sheet.on .src:nth-child(3){animation-delay:.04s}.sheet.on .src:nth-child(4){animation-delay:.12s}.sheet.on .src:nth-child(5){animation-delay:.2s}.sheet.on .src:nth-child(6){animation-delay:.28s}
@keyframes float{to{opacity:1;transform:none}}
.src svg{width:40px;height:40px;color:var(--slate)}
.src .nm{font-weight:700;font-size:.88rem}
.src .nm small{font-weight:400;color:var(--ink-soft);font-size:.66rem;margin-left:6px}
.src .ws{font-size:.8rem;line-height:1.35}
.src .nt{grid-column:1/-1;font-size:.74rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px}
.src .nt a{color:#1f8f91}
.src .tv{font-family:var(--f-num);text-align:right;white-space:nowrap}
.src .tv b{color:#c07f17;font-weight:400;font-size:1.15rem}
.src .tv span{color:#1f8f91;margin-left:4px}
.src .tv small{display:block;font-size:.66rem;color:var(--ink-soft)}
.why{background:#e3f4f4;border-radius:14px;padding:10px 12px;font-size:.8rem;opacity:0;transform:translateY(24px)}
.why b{display:block;font-size:.72rem;color:#1f8f91;margin-bottom:2px}
.sheet.on .why{animation:float .45s .36s cubic-bezier(.2,.8,.2,1) forwards}
.src-foot{font-size:.66rem;color:var(--ink-soft);text-align:center}
.x:focus-visible,.src a:focus-visible{outline-color:#1f8f91}
@media (prefers-reduced-motion:reduce){.bg,.sheet,.scrim{transition:none}.sheet.on .src,.sheet.on .why{animation:none;opacity:1;transform:none}}
@media (max-height:640px){.strip{display:none}}
</style>

const sunL=(x,y,r)=>{let s=`<circle cx="${x}" cy="${y}" r="${r}"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line x1="${(x+Math.cos(a)*(r+4)).toFixed(1)}" y1="${(y+Math.sin(a)*(r+4)).toFixed(1)}" x2="${(x+Math.cos(a)*(r+9)).toFixed(1)}" y2="${(y+Math.sin(a)*(r+9)).toFixed(1)}"/>`}return s};
const cloudL=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" vector-effect="non-scaling-stroke" d="M14 40h30a11 11 0 0 0 0-22 15 15 0 0 0-28-3 11 11 0 0 0-2 25z"/>`;
const dropsL=(x,y)=>[0,9,18].map(d=>`<line x1="${x+d}" y1="${y}" x2="${x+d-3}" y2="${y+7}"/>`).join('');
const arrowL=x=>`<path d="M${x} 30l4 3-4 3"/>`;
const peek=()=>`<path d="M36 14a9 9 0 0 1 15 9"/>`+[0,1,2,3].map(i=>{const a=-Math.PI*.9+i*Math.PI*.33;return `<line x1="${(44+Math.cos(a)*13).toFixed(1)}" y1="${(22+Math.sin(a)*13).toFixed(1)}" x2="${(44+Math.cos(a)*17).toFixed(1)}" y2="${(22+Math.sin(a)*17).toFixed(1)}"/>`}).join('');
const ICON={
  sun:()=>sunL(32,32,11),

function load(d){SITES=d.sites;DAYS=d.days;WEEK_PUB=d.weekPub;document.getElementById('snap').textContent=d.snap||''}

/* 一致度：最高気温と降水確率のばらつきから判定 */
function agree(day){
  const s=Object.values(day.src), his=s.map(x=>x.hi).filter(v=>typeof v==='number');
  const pops=s.map(x=>parseInt((String(x.pop).match(/\d+/g)||[]).pop())).filter(n=>!isNaN(n));
  const hs=Math.max(...his)-Math.min(...his), ps=pops.length>1?Math.max(...pops)-Math.min(...pops):0;
  if(hs<=1.5&&ps<=30) return {t:'高',c:'#7cd3a4'};
  if(hs<=4&&ps<=40) return {t:'中',c:'#F6DE7D'};
  return {t:'低',c:'#f0a07e'};
}
const f=v=>typeof v!=='number'?v:Number.isInteger(v)?v:v.toFixed(1);
const MOOD=ic=>({sun:'sun','sun-cloud':'sun','sun-then-cloud':'sun','cloud-sun':'cs','cloud-then-sun':'cs',cloud:'cl','cloud-rain':'rn',rain:'rn','rain-then-sun':'rn',moon:'rn'}[ic]||'cl');
const EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const JA='日月火水木金土';

/* ---------- 描画 ---------- */
const $=id=>document.getElementById(id);
let cur=0, bgOn=1;
function setBg(mood){
  const next=bgOn===1?$('bg2'):$('bg1'), prev=bgOn===1?$('bg1'):$('bg2');
  next.className='bg g-'+mood; next.style.opacity=1; prev.style.opacity=0; bgOn=bgOn===1?2:1;
  document.documentElement.classList.toggle('w-sun',mood==='sun');
}
function show(i){
  cur=Math.max(0,Math.min(DAYS.length-1,i));
  const d=DAYS[cur], a=agree(d), ji=JA.indexOf(d.dow[0]);
  setBg(MOOD(d.ic));
  $('day').innerHTML=`${EN[ji]||''}<small>${d.m}月${d.d}日</small>${cur===0?'<span class="tag">今日</span>':cur===1?'<span class="tag">明日</span>':''}`;
  $('hi').textContent=f(d.hi); $('lo').textContent=f(d.lo);
  $('wxic').innerHTML=icon(d.ic,'wxic',1.4);
  $('wx').textContent=d.wx;
  $('chip').innerHTML=`<span><i style="background:${a.c}"></i> 4社一致度 ${a.t}</span><span>降水 ${d.pop}%</span>${d.rel?`<span>信頼度 ${d.rel}</span>`:''}`;
  $('prev').disabled=cur===0; $('next').disabled=cur===DAYS.length-1;
  $('dots').innerHTML=DAYS.map((x,k)=>`<button role="tab" aria-current="${k===cur}" aria-label="${x.m}月${x.d}日"><i></i></button>`).join('');
  $('dots').querySelectorAll('button').forEach((b,k)=>b.addEventListener('click',()=>show(k)));
  let low='';
  if(d.strip) low+=`<div class="strip">${d.strip.map(s=>`<div><span class="h">${s[0]}時</span>${icon(s[1],'',2.4)}<span class="tt">${s[2]}°</span></div>`).join('')}</div>`;
  if(d.tips) low+=`<div class="tips" style="--n:${d.tips.length}">${d.tips.map(t=>`<div class="tip">${icon(t.ic,'',2)}<span>${t.k}</span><b>${t.v}</b><span class="lv" aria-label="必要度 ${t.lv}/3">${[1,2,3].map(n=>`<i class="${n<=t.lv?'on':''}"></i>`).join('')}</span></div>`).join('')}</div>`;
  else low+=`<p class="note">${d.note}</p>`;
  low+=`<button class="up" id="up">${'<svg class="li" viewBox="0 0 14 14" stroke-width="1.6"><path d="M2 9l5-5 5 5"/></svg>'}タップ・上スワイプで4社の見立て</button>`;
  $('lower').innerHTML=low;
  $('up').addEventListener('click',()=>openSheet(cur));
}
$('prev').addEventListener('click',()=>show(cur-1));
$('next').addEventListener('click',()=>show(cur+1));
$('hero').addEventListener('click',()=>openSheet(cur));
$('hero2').addEventListener('click',()=>openSheet(cur));
document.addEventListener('keydown',e=>{
  if(sheet.classList.contains('on')){if(e.key==='Escape')closeSheet();return}
  if(e.key==='ArrowLeft')show(cur-1); if(e.key==='ArrowRight')show(cur+1); if(e.key==='ArrowUp')openSheet(cur);
});
let sx=null,sy=null;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)) show(cur+(dx<0?1:-1)); else if(dy<-60&&Math.abs(dy)>Math.abs(dx)) openSheet(cur); sx=sy=null});

/* ---------- 4社の見立てシート ---------- */
const sheet=$('sheet'),scrim=$('scrim'),inner=$('sheet-in');
let lastFocus=null;
function openSheet(i){
  const d=DAYS[i];
  inner.innerHTML=`<div class="grab"></div>
   <div class="sh-head"><div><h2 id="sh-title">${d.m}月${d.d}日（${d.dow}）の4社の見立て</h2><p>結論：${d.wx}・${f(d.hi)}℃ / ${f(d.lo)}℃</p></div><button class="x" id="close" aria-label="閉じる">✕</button></div>
   ${Object.entries(d.src).map(([k,s])=>{const S=SITES[k];return `<div class="src" style="--c:${S.c}">
      ${icon(s.ic,'',2.2)}<div><div class="nm">${S.name}<small>${s.pub||WEEK_PUB[k]}</small></div><div class="ws">${s.wx}</div></div>
      <div class="tv"><b>${f(s.hi)}°</b><span>${f(s.lo)}°</span><small>${s.pop}</small></div>
      <div class="nt">${s.nt?s.nt+' ':''}<a href="${S.url}" target="_blank" rel="noopener">サイトで見る</a></div></div>`}).join('')}
   <div class="why"><b>見立ての差</b>${d.why}</div>
   <div class="src-foot">${d.note}</div>`;
  lastFocus=document.activeElement;
  sheet.classList.remove('on');void sheet.offsetWidth;
  sheet.classList.add('on');scrim.classList.add('on');sheet.scrollTop=0;
  $('close').addEventListener('click',closeSheet);
  $('close').focus({preventScroll:true});
}
function closeSheet(){sheet.classList.remove('on');scrim.classList.remove('on');lastFocus&&lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',closeSheet);
let y0=null;sheet.addEventListener('touchstart',e=>{if(sheet.scrollTop<=0)y0=e.touches[0].clientY},{passive:true});
sheet.addEventListener('touchend',e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>80)closeSheet();y0=null});

load(FALLBACK);show(0);
fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.days){load(d);show(Math.min(cur,DAYS.length-1))}}).catch(()=>{});

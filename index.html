<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="東京の天気">
<meta name="theme-color" content="#64C6C7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>東京の天気</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=M+PLUS+Rounded+1c:wght@300;400;500;700&display=swap">
<style>html,body{margin:0;height:100%;background:#708090}</style>
</head><body>
<script>
/* 本体（app.html）を毎回最新で読み込む。公開ページは10分キャッシュされるため、ここだけ小さくしておく */
fetch('app.html?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()})
 .then(t=>{document.open();document.write(t);document.close()})
 .catch(()=>{location.replace('app.html?t='+Date.now())});
</script>
</body></html>
